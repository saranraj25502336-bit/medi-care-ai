<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | MediCare AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/ui.js') }}" defer></script>
</head>
<body>
    <div class="error-page">
        <div class="error-container animate-scaleIn">
            <div class="error-icon green">
                <i class="fas fa-triangle-exclamation"></i>
            </div>
            <div class="error-code">500</div>
            <h2 class="error-title">Server Error</h2>
            <p class="error-message">Something went wrong on our end. Please try again later or contact support if the problem persists.</p>
            <a href="/" class="error-btn">
                <i class="fas fa-home"></i> Go Home
            </a>
        </div>
    </div>
</body>
</html>
