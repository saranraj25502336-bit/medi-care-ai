<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Login | MediCare AI Hospital</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, #e8f4fb 0%, #d3edf5 50%, #c7e8f2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #ffffff; border-radius: 26px; width: 100%; max-width: 430px; padding: 34px 30px; box-shadow: 0 24px 60px rgba(30, 80, 130, .18); border: 1px solid rgba(255,255,255,.7); }
  .brand { text-align: center; margin-bottom: 22px; }
  .brand .logo { width: 62px; height: 62px; margin: 0 auto 10px; border-radius: 20px; background: linear-gradient(135deg,#2e86de,#4fa3e8); display: flex; align-items: center; justify-content: center; font-size: 28px; color: #fff; box-shadow: 0 10px 22px rgba(46,134,222,.35); }
  .brand h1 { font-size: 1.25rem; color: #10365c; letter-spacing: .2px; }
  .brand p { font-size: .8rem; color: #6b88a3; margin-top: 3px; }
  .tabs { display: flex; background: #eef6fb; border-radius: 14px; padding: 5px; margin-bottom: 20px; }
  .tabs button { flex:1; border:none; background:transparent; padding: 10px; border-radius: 11px; cursor: pointer; font-weight:600; font-size:.82rem; color:#4a6b87; transition:.2s; }
  .tabs button.active { background:#fff; color:#10365c; box-shadow: 0 4px 12px rgba(46,134,222,.18); }
  .panel { display:none; }
  .panel.active { display:block; }
  label { display:block; font-size:.78rem; font-weight:600; color:#10365c; margin:12px 0 6px; }
  input { width:100%; padding: 12px 14px; border:1.5px solid #d8e6f2; border-radius: 12px; font-size:.92rem; outline:none; transition:.2s; }
  input:focus { border-color:#2e86de; box-shadow:0 0 0 3px rgba(46,134,222,.12); }
  .btn { width:100%; padding: 13px; border:none; border-radius: 12px; font-size:.95rem; font-weight:700; cursor:pointer; margin-top:16px; transition:.2s; }
  .btn-primary { background: linear-gradient(135deg,#2e86de,#4fa3e8); color:#fff; box-shadow: 0 8px 20px rgba(46,134,222,.3); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(46,134,222,.4); }
  .btn-outline { background:transparent; color:#2e86de; border:1.5px solid #2e86de; }
  .camera { width:100%; border-radius: 14px; background:#0e2a44; margin-top:10px; display:none; }
  .camera.on { display:block; }
  .status { font-size:.8rem; color:#4a6b87; margin-top:8px; text-align:center; min-height:18px; }
  .foot { margin-top:18px; text-align:center; font-size:.82rem; color:#6b88a3; }
  .foot a { color:#2e86de; text-decoration:none; font-weight:600; }
  .alert { padding:10px; border-radius:10px; font-size:.8rem; margin-top:10px; display:none; }
  .alert.ok { display:block; background:#e5f7ef; color:#14713d; }
  .alert.err { display:block; background:#fdecec; color:#b02525; }
  .pill { display:inline-block; background:#e8f4fb; color:#2e86de; padding:5px 12px; border-radius:50px; font-size:.72rem; font-weight:600; margin:0 4px 6px 0; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="logo"><i class="fa" style="font-family:serif;">+</i></div>
    <h1>MediCare Patient Portal</h1>
    <p>Sign in to manage appointments, records & your live queue</p>
  </div>

  <div class="tabs">
    <button id="tabFace" class="active" onclick="show('face')">Face Login</button>
    <button id="tabManual" onclick="show('manual')">ID / Email Login</button>
  </div>

  <div class="panel active" id="panelFace">
    <video id="cam" class="camera on" autoplay playsinline></video>
    <canvas id="cv" style="display:none;"></canvas>
    <button class="btn btn-primary" onclick="snap()">Capture & Sign In</button>
    <div class="status" id="faceStatus">Position your face in the camera</div>
    <div class="alert" id="faceAlert"></div>
  </div>

  <div class="panel" id="panelManual">
    <label>Patient ID or Email</label>
    <input type="text" id="pid" placeholder="Enter Patient ID or Email">
    <label>Password</label>
    <input type="password" id="pw" placeholder="Your account password">
    <button class="btn btn-primary" onclick="login()">Sign In</button>
    <div class="alert" id="mAlert"></div>
  </div>

  <div class="foot">
    <div style="margin-bottom:8px;"><a href="/register">Create a new patient account →</a></div>
    <span class="pill">Appointments</span><span class="pill">Medical Records</span>
    <span class="pill">Live Queue</span><span class="pill">Prescriptions</span>
  </div>
</div>

<script>
  var stream = null;
  function show(t) {
    document.getElementById('tabFace').classList.toggle('active', t==='face');
    document.getElementById('tabManual').classList.toggle('active', t==='manual');
    document.getElementById('panelFace').classList.toggle('active', t==='face');
    document.getElementById('panelManual').classList.toggle('active', t==='manual');
    if (t==='face') startCam(); else stopCam();
  }
  function startCam() {
    if (!navigator.mediaDevices) return;
    navigator.mediaDevices.getUserMedia({ video: { width: 420, height: 320 } }).then(s => { stream = s; document.getElementById('cam').srcObject = s; }).catch(()=>{});
  }
  function stopCam(){ if (stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }
  function alert(el, msg, ok){ el.textContent = msg; el.className = 'alert ' + (ok?'ok':'err'); }

  function snap() {
    var el = document.getElementById('faceAlert');
    var v = document.getElementById('cam');
    if (!v.srcObject) { alert(el, 'Camera not available. Use ID/Email login instead.', false); return; }
    var cv = document.getElementById('cv'); cv.width=v.videoWidth; cv.height=v.videoHeight;
    cv.getContext('2d').drawImage(v,0,0,cv.width,cv.height);
    var img = cv.toDataURL('image/jpeg', 0.9);
    alert(el, 'Recognizing…', true);
    fetch('/face-login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ image: img }) })
      .then(r=>r.json()).then(d => {
        if (d.success) { alert(el, 'Welcome back! Redirecting…', true); setTimeout(()=>location.href='/dashboard', 800); }
        else alert(el, d.message || 'Face not recognized', false);
      }).catch(()=>alert(el, 'Connection error', false));
  }

  function login() {
    var el = document.getElementById('mAlert');
    var pid = document.getElementById('pid').value.trim();
    var pw = document.getElementById('pw').value;
    if (!pid || !pw) { alert(el, 'Enter Patient ID/Email and password.', false); return; }
    fetch('/manual-login', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ patient_id: /^\d+$/.test(pid) ? pid : null, email: /^\d+$/.test(pid) ? null : pid, password: pw }) })
      .then(r=>r.json()).then(d => {
        if (d.success) { alert(el, 'Sign-in successful! Redirecting…', true); setTimeout(()=>location.href='/dashboard', 600); }
        else alert(el, d.message || 'Login failed', false);
      }).catch(()=>alert(el, 'Connection error', false));
  }

  startCam();
  window.addEventListener('beforeunload', stopCam);
</script>
</body>
</html>
