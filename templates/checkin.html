<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Check-in Kiosk | MediCare AI Hospital</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
  body { background:#0f172a; color:#fff; font-family:'Inter',system-ui,sans-serif; margin:0; text-align:center; }
  h1 { font-size:1.6rem; margin:18px 0 6px; color:#c9a227; }
  .sub { color:#94a3b8; margin-bottom:18px; font-size:.9rem; }
  .modes { display:flex; justify-content:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .modes button { padding:10px 18px; border-radius:12px; border:none; background:#1e293b; color:#e2e8f0; cursor:pointer; font-size:.9rem; }
  .modes button.active { background:#c9a227; color:#0f172a; font-weight:700; }
  .panel { background:#1e293b; border-radius:16px; max-width:560px; margin:0 auto 20px; padding:20px; }
  video, canvas { width:100%; max-width:420px; border-radius:12px; background:#000; }
  input { width:70%; padding:12px; border-radius:10px; border:1px solid #334155; background:#0f172a; color:#fff; font-size:1rem; margin:6px 0; }
  button.big { padding:12px 22px; border-radius:12px; border:none; cursor:pointer; font-size:1rem; font-weight:700; background:#c9a227; color:#0f172a; }
  button.green { background:#15803d; color:#fff; }
  #result { margin-top:14px; font-size:1rem; min-height:24px; }
  #result.ok { color:#4ade80; } #result.err { color:#f87171; }
  .token-big { font-size:1.6rem; font-weight:800; color:#c9a227; padding:8px 0; }
  .back { color:#94a3b8; font-size:.85rem; margin-top:10px; display:inline-block; }
</style>
</head>
<body>
<h1>Patient Check-in</h1>
<div class="sub">Face · QR · Manual — MediCare AI Hospital</div>

<div class="modes">
  <button class="active" id="btnFace" onclick="showMode('face')">Face</button>
  <button id="btnQR" onclick="showMode('qr')">QR Code</button>
  <button id="btnManual" onclick="showMode('manual')">Manual</button>
</div>

<div class="panel" id="facePanel">
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" style="display:none;"></canvas>
  <div style="margin-top:12px;">
    <button class="big" onclick="captureFace()">📷 Scan Face & Check-in</button>
  </div>
</div>

<div class="panel" id="qrPanel" style="display:none;">
  <p style="color:#94a3b8;">Enter or scan the QR token from the patient's appointment.</p>
  <input id="qrInput" placeholder="Paste QR token here…">
  <div style="margin-top:10px;">
    <button class="big green" onclick="qrCheckin()">Verify & Check-in</button>
  </div>
</div>

<div class="panel" id="manualPanel" style="display:none;">
  <p style="color:#94a3b8;">Type the patient ID or phone number.</p>
  <input id="manualInput" placeholder="Patient ID or phone…">
  <div style="margin-top:10px;">
    <button class="big green" onclick="manualCheckin()">Find & Check-in</button>
  </div>
</div>

<div id="result"></div>
<a class="back" href="/reception">← Back to Reception</a>

<script>
  var CSRF = {{ csrf_token|tojson }};
  var stream = null;

  function showMode(mode) {
    ['btnFace','btnQR','btnManual'].forEach(id => document.getElementById(id).classList.remove('active'));
    document.getElementById('btn' + m2(mode)).classList.add('active');
    document.getElementById('facePanel').style.display = mode === 'face' ? 'block' : 'none';
    document.getElementById('qrPanel').style.display = mode === 'qr' ? 'block' : 'none';
    document.getElementById('manualPanel').style.display = mode === 'manual' ? 'block' : 'none';
    if (mode === 'face') startCam(); else stopCam();
  }
  function m2(m){ return m.charAt(0).toUpperCase() + m.slice(1); }

  function startCam() {
    if (navigator.mediaDevices) navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } })
      .then(s => { stream = s; document.getElementById('video').srcObject = s; });
  }
  function stopCam() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }

  function setResult(msg, ok) {
    var r = document.getElementById('result');
    r.className = ok ? 'ok' : 'err';
    r.innerHTML = msg;
  }

  function captureFace() {
    var v = document.getElementById('video'), c = document.getElementById('canvas');
    if (!v.srcObject) { setResult('Camera not available. Use QR or manual check-in.', false); return; }
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    var data = c.toDataURL('image/jpeg', 0.9);
    setResult('Recognizing face & checking in…', true);
    fetch('/api/checkin/face', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ image: data, csrf_token: CSRF }) })
      .then(r => r.json()).then(d => {
        if (d.success && d.token) {
          setResult('✔ ' + (d.department||'') + ' · Token <b class="token-big">' + (d.token.token_code||'') + '</b>', true);
        } else { setResult(d.message || 'Not recognized', false); }
        setTimeout(() => setResult('', false), 8000);
      });
  }

  function qrCheckin() {
    var tok = document.getElementById('qrInput').value.trim();
    if (!tok) { setResult('Enter a QR token.', false); return; }
    fetch('/api/qr/verify', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token: tok }) })
      .then(r => r.json()).then(d => {
        if (!d.success) { setResult(d.message || 'Invalid QR', false); return; }
        checkinByAttrs(d.patient_id, 'qr', d.appointment_id);
      });
  }

  function manualCheckin() {
    var q = document.getElementById('manualInput').value.trim();
    if (!q) { setResult('Enter a patient ID or phone.', false); return; }
    fetch('/api/checkin/search?q=' + encodeURIComponent(q)).then(r => r.json()).then(d => {
      if (!d.results.length) { setResult('Patient not found.', false); return; }
      var p = d.results[0];
      checkinByAttrs(p.patient_id, 'manual', null);
    });
  }

  function checkinByAttrs(patientId, method, appointmentId) {
    setResult('Checking in…', true);
    fetch('/api/checkin', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ patient_id: patientId, method: method, csrf_token: CSRF, appointment_id: appointmentId || null }) })
      .then(r => r.json()).then(d => {
        if (d.success && d.token) {
          setResult('✔ ' + (d.department||'') + ' · Token <b class="token-big">' + (d.token.token_code||'') + '</b>' + (d.duplicate ? ' (already checked in)' : ''), true);
        } else { setResult(d.message || 'Check-in failed', false); }
      });
  }

  startCam();
</script>
</body>
</html>
