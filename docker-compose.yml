version: '3.8'

services:
  # Main application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-hospital-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_POOL_SIZE=10
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DOCTOR_ACCESS_CODE=${DOCTOR_ACCESS_CODE}
      - RATE_LIMIT_STORAGE_URL=redis://redis:6379/1
      - FACE_TOLERANCE=${FACE_TOLERANCE:-0.5}
      - FACE_MODEL=${FACE_MODEL:-buffalo_l}
      - FACE_MIN_CONFIDENCE=${FACE_MIN_CONFIDENCE:-0.3}
      - FACE_PROVIDERS=CPUExecutionProvider
      - CAMERA_INDEX=0
      - EMAIL_ENABLED=${EMAIL_ENABLED:-0}
      - EMAIL_ADDRESS=${EMAIL_ADDRESS}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - MAIL_SERVER=${MAIL_SERVER:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USE_TLS=1
      - SMS_ENABLED=${SMS_ENABLED:-0}
      - SMS_API_KEY=${SMS_API_KEY}
      - SMS_SENDER_ID=${SMS_SENDER_ID:-HOSPMG}
      - LOG_LEVEL=INFO
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./face_encodings:/app/face_encodings
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smart-hospital-network

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: smart-hospital-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./migrations:/docker-entrypoint-initdb.d/migrations:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - smart-hospital-network
    command:
      - --default-authentication-plugin=mysql_native_password
      - --max-connections=100

  # Redis for rate limiting, caching, SocketIO
  redis:
    image: redis:7-alpine
    container_name: smart-hospital-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart-hospital-network
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # Nginx reverse proxy (production)
  nginx:
    image: nginx:alpine
    container_name: smart-hospital-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./static:/var/www/static:ro
    depends_on:
      - app
    networks:
      - smart-hospital-network
    profiles:
      - production

  # Backup service
  backup:
    image: mysql:8.0
    container_name: smart-hospital-backup
    restart: "no"
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    networks:
      - smart-hospital-network
    profiles:
      - backup
    entrypoint: ["sh", "/backup.sh"]

volumes:
  db_data:
  redis_data:

networks:
  smart-hospital-network:
    driver: bridge